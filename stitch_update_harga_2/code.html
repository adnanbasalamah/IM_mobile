<!DOCTYPE html>

<html lang="id"><head>
<meta charset="utf-8"/>
<meta content="width=device-width, initial-scale=1.0" name="viewport"/>
<script src="https://cdn.tailwindcss.com?plugins=forms,container-queries"></script>
<link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600;700&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<link href="https://fonts.googleapis.com/css2?family=Material+Symbols+Outlined:wght,FILL@100..700,0..1&amp;display=swap" rel="stylesheet"/>
<script id="tailwind-config">
        tailwind.config = {
            darkMode: "class",
            theme: {
                extend: {
                    "colors": {
                        "surface-container-lowest": "#ffffff",
                        "surface-bright": "#f8f9fb",
                        "secondary": "#555f70",
                        "surface-tint": "#3755c3",
                        "on-secondary-fixed": "#121c2a",
                        "on-tertiary-container": "#5bcf9e",
                        "on-primary-fixed-variant": "#173bab",
                        "surface-container-highest": "#e1e2e4",
                        "on-primary": "#ffffff",
                        "tertiary-fixed": "#85f8c4",
                        "secondary-container": "#d6e0f4",
                        "outline": "#757684",
                        "tertiary-fixed-dim": "#68dba9",
                        "inverse-surface": "#2e3132",
                        "surface": "#f8f9fb",
                        "primary-container": "#1e40af",
                        "outline-variant": "#c4c5d5",
                        "surface-container": "#edeef0",
                        "on-tertiary-fixed": "#002114",
                        "primary-fixed-dim": "#b8c4ff",
                        "on-secondary-container": "#596374",
                        "secondary-fixed-dim": "#bdc7db",
                        "on-surface": "#191c1e",
                        "error-container": "#ffdad6",
                        "on-tertiary": "#ffffff",
                        "tertiary-container": "#00563a",
                        "secondary-fixed": "#d9e3f7",
                        "on-background": "#191c1e",
                        "surface-container-high": "#e7e8ea",
                        "surface-variant": "#e1e2e4",
                        "inverse-primary": "#b8c4ff",
                        "on-primary-fixed": "#001453",
                        "error": "#ba1a1a",
                        "surface-dim": "#d9dadc",
                        "primary-fixed": "#dde1ff",
                        "on-secondary-fixed-variant": "#3d4757",
                        "on-primary-container": "#a8b8ff",
                        "on-secondary": "#ffffff",
                        "on-error-container": "#93000a",
                        "on-error": "#ffffff",
                        "background": "#f8f9fb",
                        "surface-container-low": "#f3f4f6",
                        "inverse-on-surface": "#f0f1f3",
                        "primary": "#00288e",
                        "on-surface-variant": "#444653",
                        "on-tertiary-fixed-variant": "#005137",
                        "tertiary": "#003d28"
                    },
                    "borderRadius": {
                        "DEFAULT": "0.25rem",
                        "lg": "0.5rem",
                        "xl": "0.75rem",
                        "full": "9999px"
                    },
                    "spacing": {
                        "unit": "4px",
                        "input-height": "48px",
                        "element-gap": "12px",
                        "container-padding": "16px"
                    },
                    "fontFamily": {
                        "data-entry": ["Inter"],
                        "header-section": ["Inter"],
                        "display": ["Inter"],
                        "body-main": ["Inter"],
                        "caption": ["Inter"],
                        "label-caps": ["Inter"]
                    },
                    "fontSize": {
                        "data-entry": ["16px", {"lineHeight": "20px", "fontWeight": "500"}],
                        "header-section": ["18px", {"lineHeight": "24px", "fontWeight": "600"}],
                        "display": ["24px", {"lineHeight": "32px", "fontWeight": "700"}],
                        "body-main": ["16px", {"lineHeight": "24px", "fontWeight": "400"}],
                        "caption": ["12px", {"lineHeight": "16px", "fontWeight": "400"}],
                        "label-caps": ["12px", {"lineHeight": "16px", "letterSpacing": "0.05em", "fontWeight": "600"}]
                    }
                },
            },
        }
    </script>
<style>
        body { font-family: 'Inter', sans-serif; }
        .material-symbols-outlined {
            font-variation-settings: 'FILL' 0, 'wght' 400, 'GRAD' 0, 'opsz' 24;
        }
    </style>
<style>
    body {
      min-height: max(884px, 100dvh);
    }
  </style>
</head>
<body class="bg-background text-on-background min-h-screen pb-[120px]">
<!-- TopAppBar -->
<header class="bg-surface-container-lowest dark:bg-inverse-surface border-b border-outline-variant dark:border-outline shadow-sm dark:shadow-none docked full-width top-0 sticky z-50">
<div class="flex justify-between items-center w-full px-container-padding h-input-height">
<div class="flex items-center gap-4">
<button class="active:scale-95 duration-100 hover:bg-surface-container-high transition-colors p-2 rounded-full">
<span class="material-symbols-outlined text-primary dark:text-primary-fixed-dim">arrow_back</span>
</button>
<h1 class="font-header-section text-header-section text-primary dark:text-primary-fixed-dim">Update Harga</h1>
</div>
<button class="active:scale-95 duration-100 hover:bg-surface-container-high transition-colors p-2 rounded-full">
<span class="material-symbols-outlined text-on-surface-variant dark:text-outline-variant">search</span>
</button>
</div>
</header>
<main class="px-container-padding py-6 flex flex-col gap-6"><section class="mb-2">
<h2 class="font-display text-display text-on-surface">Ayam Broiler</h2>
</section>
<!-- Product Header Card -->
<!-- Input Section -->
<section class="grid grid-cols-1 gap-4">
<div class="bg-surface-container-lowest p-5 rounded-xl border border-outline-variant shadow-sm flex flex-col gap-4">
<!-- Harga Modal -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-secondary uppercase tracking-wider">Harga Modal (Per Kg)</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-display text-display text-outline">Rp</span>
<input class="w-full h-[64px] pl-16 pr-12 rounded-lg border-2 border-outline-variant focus:border-primary-container focus:ring-0 font-display text-display text-on-surface transition-all" placeholder="0" type="number" value="32000"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined">cancel</span>
</button>
</div>
</div>
<!-- Harga Jual -->
<div class="flex flex-col gap-2">
<label class="font-label-caps text-label-caps text-secondary uppercase tracking-wider">Harga Jual (Per Kg)</label>
<div class="relative">
<span class="absolute left-4 top-1/2 -translate-y-1/2 font-display text-display text-outline">Rp</span>
<input class="w-full h-[64px] pl-16 pr-12 rounded-lg border-2 border-outline-variant focus:border-primary-container focus:ring-0 font-display text-display text-on-surface transition-all" placeholder="0" type="number" value="38500"/>
<button class="absolute right-4 top-1/2 -translate-y-1/2 text-outline hover:text-primary transition-colors">
<span class="material-symbols-outlined">cancel</span>
</button>
</div>
</div>
<!-- Profit Info -->
<div class="mt-2 p-3 bg-tertiary-fixed/20 border border-tertiary-fixed rounded-lg flex justify-between items-center">
<span class="font-body-main text-body-main text-tertiary">Estimasi Keuntungan:</span>
<span class="font-header-section text-header-section text-tertiary">+Rp 6.500 (20.3%)</span>
</div>
</div>
</section>
<!-- History Section -->
<!-- Save Button Container -->
<div class="fixed bottom-[64px] left-0 w-full px-container-padding py-4 bg-background/80 backdrop-blur-md z-40">
<button class="w-full h-input-height bg-primary text-on-primary font-header-section rounded-xl shadow-lg active:scale-[0.98] transition-transform">
                Simpan Perubahan
            </button>
</div>
</main>
<!-- BottomNavBar -->
<nav class="fixed bottom-0 left-0 w-full z-50 flex justify-around items-center px-2 py-2 h-[64px] bg-surface-container-lowest dark:bg-inverse-surface border-t border-outline-variant dark:border-outline shadow-md dark:shadow-none">
<div class="flex flex-col items-center justify-center text-secondary dark:text-outline-variant px-4 py-1 hover:bg-surface-container dark:hover:bg-secondary-container/10 active:scale-90 transition-transform cursor-pointer">
<span class="material-symbols-outlined">swap_horiz</span>
<span class="font-label-caps text-label-caps">Transfer</span>
</div>
<div class="flex flex-col items-center justify-center bg-secondary-container dark:bg-tertiary-container text-on-secondary-container dark:text-on-tertiary-container rounded-xl px-4 py-1 active:scale-90 transition-transform cursor-pointer">
<span class="material-symbols-outlined" style="font-variation-settings: 'FILL' 1;">inventory</span>
<span class="font-label-caps text-label-caps">Stok</span>
</div>
<div class="flex flex-col items-center justify-center text-secondary dark:text-outline-variant px-4 py-1 hover:bg-surface-container dark:hover:bg-secondary-container/10 active:scale-90 transition-transform cursor-pointer">
<span class="material-symbols-outlined">point_of_sale</span>
<span class="font-label-caps text-label-caps">Kasir</span>
</div>
</nav>
</body></html>
